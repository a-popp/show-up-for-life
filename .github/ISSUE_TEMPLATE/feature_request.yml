name: Feature request
description: Suggest a product or developer-experience improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Please avoid private user data and secrets. Product features should be traceable to design.md or an explicit open decision.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: considerations
    attributes:
      label: Privacy, safety, accessibility, and cost considerations
      description: Mention sensitive data, abuse potential, inclusive-design impact, or recurring infrastructure cost.
