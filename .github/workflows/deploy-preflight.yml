name: Deployment preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-manual
  cancel-in-progress: false

jobs:
  preflight:
    name: Manual deployment preflight
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'

      - name: Validate deployment scaffolding
        run: python scripts/check_workspace.py --deployment-preflight

      - name: Print manual deployment boundaries
        run: |
          echo "This workflow performs no deployment and calls no cloud mutation API."
          echo "Review docs/ci-cd/app-platform.md before any provisioning."
          echo "App Platform auto-deploy may not wait for GitHub Actions checks."
